<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChronoGlobe example</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #070b14;
        color: #e6edf6;
        font: 14px/1.4 'Inter Variable', system-ui, sans-serif;
      }
      #globe {
        position: absolute;
        inset: 0;
      }
      .demo-bar {
        position: absolute;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 10px;
        background: rgba(14, 20, 32, 0.86);
      }
      .demo-bar input {
        width: 6em;
        font: inherit;
        color: inherit;
        background: #162033;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 6px;
        padding: 2px 6px;
      }
      .demo-bar button {
        font: inherit;
        color: inherit;
        background: #162033;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 6px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .demo-status {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: 60ch;
        color: #9aa7b8;
        font-size: 12px;
      }
      body.shot .demo-bar,
      body.shot .demo-status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <form class="demo-bar" id="bar">
      <button type="button" data-step="-100" aria-label="100 years back">−100</button>
      <button type="button" data-step="-10" aria-label="10 years back">−10</button>
      <label>Year <input id="year" inputmode="numeric" /></label>
      <button type="button" data-step="10" aria-label="10 years forward">+10</button>
      <button type="button" data-step="100" aria-label="100 years forward">+100</button>
      <button type="button" id="spin">Spin</button>
    </form>
    <p class="demo-status" id="status" aria-live="polite"></p>
    <script type="module" src="./basic.ts"></script>
  </body>
</html>
